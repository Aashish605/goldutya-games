<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GOLDUTYA MEMORY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="memory.css">
  <link rel="stylesheet" href="leaderboard.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E" />
  <meta property="og:title" content="Goldutya Memory — Match the Gold" />
  <meta property="og:description" content="Flip cards, match pairs, beat your best. Memory gold on the TON ecosystem." />
  <meta property="og:image" content="assets/card-memory.png" />
</head>
<body class="grid-bg">
  <div class="memory-container">
    <header class="topbar">
      <button class="mute-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
      <h1 class="title">GOLDUTYA MEMORY</h1>
      <div class="bestscore" id="bestScore">BEST: --</div>
    </header>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-num" id="timer">00:00</span>
        <span class="stat-label">TIME</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="liveScore">0</span>
        <span class="stat-label">SCORE</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="moves">0</span>
        <span class="stat-label">MOVES</span>
      </div>
    </div>

    <div class="card-grid grid-easy" id="cardGrid"></div>

    <div class="overlay" id="overlay">
      <div class="overlay-content">
        <img class="overlay-duck-img" src="assets/duck-mid.png" alt="Goldutya duck mascot" aria-hidden="true" />
        <h2 class="overlay-title" id="overlayTitle">GOLDUTYA MEMORY</h2>
        <div class="difficulty-btns" id="diffBtns">
          <button class="difficulty-btn active" data-diff="easy">EASY</button>
          <button class="difficulty-btn" data-diff="medium">MED</button>
          <button class="difficulty-btn" data-diff="hard">HARD</button>
        </div>
        <p class="overlay-sub" id="overlaySub">Match pairs to win!</p>
        <button class="btn" id="startBtn">START</button>
        <button class="share-btn" id="shareBtn" style="display:none;">SHARE SCORE</button>
        <div id="leaderboard" class="lb-container"></div>
        <div class="skin-picker" id="skinPicker">
          <span class="skin-label">SKIN</span>
          <button class="skin-opt active" data-skin="default" aria-label="Default skin">🦆</button>
          <button class="skin-opt" data-skin="gold" aria-label="Gold skin">🪙</button>
          <button class="skin-opt" data-skin="crown" aria-label="Crown skin">👑</button>
        </div>
        <p class="hint">Flip cards · Match pairs · Beat your best</p>
        <p class="hint" style="margin-top:8px"><a href="index.html" class="btn-back">🎮 ALL GAMES</a></p>
        <p class="hint" style="margin-top:6px">
          <a href="fly.html" style="color:var(--gold)">▶ FLY</a> ·
          <a href="jump.html" style="color:var(--cyan)">▶ JUMP</a> ·
          <a href="clicker.html" style="color:var(--red)">▶ CLICKER</a> ·
          <a href="snake.html" style="color:#4CAF50">▶ SNAKE</a> ·
          <a href="breakout.html" style="color:#FF9800">▶ BREAKOUT</a>
        </p>
      </div>
    </div>
  </div>

  <script src="telegram.js"></script>
  <script src="leaderboard.js"></script>
  <script src="difficulty.js"></script>
  <script src="memory.js"></script>
</body>
</html>
