<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0D" />
  <title>Goldutya Fly — Quack Like a Champ</title>
  <meta name="description" content="Goldutya Fly. Flap the Goldutya duck through the pipes. Quack survival on the TON ecosystem." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="difficulty.css" />
  <link rel="stylesheet" href="leaderboard.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E" />
  <meta property="og:title" content="Goldutya Fly — Quack Like a Champ" />
  <meta property="og:description" content="Flap the Goldutya duck through the pipes. Quack survival on the TON ecosystem." />
  <meta property="og:image" content="assets/card-fly.png" />
</head>
<body class="grid-bg">
  <div class="stage">
    <canvas id="game"></canvas>

    <header class="topbar">
      <button id="muteBtn" class="mute-btn" aria-label="Toggle sound">🔊</button>
      <h1 class="title">GOLDUTYA <span>FLY</span></h1>
      <div class="bestscore">BEST <b id="best">0</b></div>
    </header>

    <div id="overlay" class="overlay">
      <img class="overlay-duck-img" src="assets/duck-mid.png" alt="Goldutya duck mascot" aria-hidden="true" />
      <h2 class="overlay-title">GOLDUTYA FLY</h2>
      <p class="overlay-sub">Flap the duck. Dodge the pipes. Quack forever.</p>
      <div id="diffPicker"></div>
      <button id="startBtn" class="btn">START</button>
      <button id="shareBtn" class="btn share-btn" style="display:none">SHARE SCORE</button>
      <div id="leaderboard" class="lb-container"></div>
      <div id="skinPicker" class="skin-picker"></div>
      <p class="hint">tap / click / space / up-arrow to flap</p>
      <p class="mini">Play-to-earn on the TON ecosystem</p>
      <p class="hint" style="margin-top:8px"><a href="index.html" class="btn-back">🎮 ALL GAMES</a></p>
      <p class="hint" style="margin-top:6px">
        <a href="jump.html" style="color:var(--cyan)">▶ JUMP</a> ·
        <a href="clicker.html" style="color:var(--red)">▶ CLICKER</a> ·
        <a href="snake.html" style="color:#4CAF50">▶ SNAKE</a> ·
        <a href="memory.html" style="color:#9C27B0">▶ MEMORY</a> ·
        <a href="breakout.html" style="color:#FF9800">▶ BREAKOUT</a>
      </p>
    </div>
  </div>

  <script src="telegram.js"></script>
  <script src="leaderboard.js"></script>
  <script src="difficulty.js"></script>
  <script src="game.js"></script>
</body>
</html>
