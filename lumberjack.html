<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Goldutya LumberJack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#D3F8FF">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link href="lumberjack.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/gamepad.png">
</head>
<body class="lumberjack_page">
  <div id="page_wrap" class="page_wrap ready in_greet">
    <div id="page_header_wrap" class="page_header_wrap">
      <div id="page_content_wrap" class="page_content_wrap">
        <div id="page_content" class="page_content">
          <div id="table_content" class="table_content" style="display:block;">
            <div class="game_title">LumberJack</div>
            <div class="result_score">
              <div class="result_score_text">You scored</div>
              <div id="score_value" class="score_value">0</div>
              <div class="score_share_wrap">
                <div id="score_share" class="score_share">Share</div>
              </div>
            </div>
            <div class="table_wrap" id="table_wrap">
              <ul id="table" class="table"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="canvas_wrap" class="canvas_wrap userty">
      <div id="g_canvas_wrap" class="canvas_wrap ground">
        <canvas id="g_canvas" width="750" height="212"></canvas>
      </div>
      <canvas id="game_canvas" width="750" height="572"></canvas>
    </div>

    <div id="page_footer_wrap" class="page_footer_wrap">
      <div id="page_footer" class="page_footer">
        <div id="buttons" class="buttons">
          <div id="button_wrap_left" class="button_wrap button_left">
            <div id="button_left" class="button">
              <div class="icon"></div>
              <div class="icon_refresh"></div>
              <div class="icon_play"></div>
            </div>
          </div>
          <div id="button_wrap_right" class="button_wrap button_right">
            <div id="button_right" class="button">
              <div class="icon"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="lumberjack.js"></script>
</body>
</html>
