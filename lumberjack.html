<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#333">
<title>LumberJack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lumberjack.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪓%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="page_wrap" class="page_wrap loading in_result in_greet">
  <div id="canvas_wrap" class="canvas_wrap"></div>

  <div id="page_content_wrap" class="page_content_wrap">
    <div class="page_content">
      <div id="table_content" class="table_content">
        <div class="game_title">LumberJack</div>
        <div class="result_score">
          <div>You scored</div>
          <div id="score_value" class="score_value"></div>
          <div class="score_share_wrap">
            <div id="score_share" class="score_share">Share</div>
          </div>
        </div>
        <div id="table_wrap" class="table_wrap">
          <ul id="table" class="table"></ul>
        </div>
      </div>
    </div>
  </div>

  <div class="page_footer_wrap">
    <div class="page_footer">
      <div class="buttons">
        <div class="button_wrap button_left">
          <div id="btnLeft" class="button" role="button" aria-label="Chop left / Play">
            <div class="icon"></div>
            <div class="icon_refresh"></div>
            <div class="icon_play"></div>
          </div>
        </div>
        <div class="button_wrap button_right">
          <div id="btnRight" class="button" role="button" aria-label="Chop right">
            <div class="icon"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</nav>

</body>
</html>
