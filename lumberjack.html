<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#333">
<title>GOLDUTYA LUMBERJACK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="gameover.css">
<link rel="stylesheet" href="difficulty.css">
<link rel="stylesheet" href="leaderboard.css">
<link rel="stylesheet" href="lumberjack.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪓%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="page_wrap" id="page_wrap">
  <div id="canvas_wrap" class="canvas_wrap">
    <canvas id="game" width="600" height="672"></canvas>
  </div>

  <div class="overlay" id="overlay">
    <img class="overlay-duck-img" src="assets/duck-mid.png" alt="Goldutya duck mascot" aria-hidden="true">
    <h2 class="overlay-title" id="overlayTitle">GOLDUTYA LUMBERJACK</h2>
    <p class="overlay-sub" id="overlaySub">Tap left or right to chop the tree! Avoid branches on your side!</p>
    <div id="diffPicker"></div>
    <button class="btn" id="startBtn">START</button>
    <button class="btn share-btn" id="shareBtn" style="display:none;">SHARE SCORE</button>
    <div id="leaderboard" class="lb-container"></div>
    <p class="hint" id="hint">Left/Right arrow keys or tap buttons to chop</p>
    <p class="mini">Play-to-earn on the TON ecosystem</p>
    <p class="hint" style="margin-top:8px"><a href="index.html" class="btn-back"><svg class="icon" viewBox="0 0 24 24"><use href="assets/icons.svg#gamepad"/></svg> ALL GAMES</a></p>
    <p class="hint" style="margin-top:6px">
      <a href="fly.html" style="color:var(--gold)"><svg class="icon" viewBox="0 0 24 24"><use href="assets/icons.svg#arrow-right"/></svg> FLY</a> ·
      <a href="jump.html" style="color:var(--cyan)"><svg class="icon" viewBox="0 0 24 24"><use href="assets/icons.svg#arrow-right"/></svg> JUMP</a> ·
      <a href="clicker.html" style="color:var(--red)"><svg class="icon" viewBox="0 0 24 24"><use href="assets/icons.svg#arrow-right"/></svg> CLICKER</a> ·
      <a href="memory.html" style="color:#9C27B0"><svg class="icon" viewBox="0 0 24 24"><use href="assets/icons.svg#arrow-right"/></svg> MEMORY</a> ·
      <a href="breakout.html" style="color:#FF9800"><svg class="icon" viewBox="0 0 24 24"><use href="assets/icons.svg#arrow-right"/></svg> BREAKOUT</a> ·
      <a href="snake.html" style="color:#4CAF50"><svg class="icon" viewBox="0 0 24 24"><use href="assets/icons.svg#arrow-right"/></svg> SNAKE</a>
    </p>
  </div>

  <div class="page_footer">
    <div class="buttons">
      <div class="button_wrap button_left">
        <button id="btnLeft" class="button" aria-label="Chop left">
          <div class="icon"></div>
        </button>
      </div>
      <div class="button_wrap button_right">
        <button id="btnRight" class="button" aria-label="Chop right">
          <div class="icon"></div>
        </button>
      </div>
    </div>
  </div>
</div>
<script src="difficulty.js"></script>
<script src="lumberjack.js"></script>
</body>
</html>
