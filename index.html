<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0D" />
  <title>Goldutya Games — Play · Earn · Quack</title>
  <meta name="description" content="Goldutya Games. A collection of arcade, puzzle, and action games built for the TON ecosystem." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style-hub.css" />
  <link rel="stylesheet" href="leaderboard.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E" />
</head>
<body class="grid-bg">
  <div class="hub">
    <header class="hub-header">
      <img class="hub-logo" src="assets/duck-mid.png" alt="Goldutya" />
      <h1 class="hub-title">GOLDUTYA <span>GAMES</span></h1>
      <p class="hub-sub">Play · Earn · Quack</p>

      <div class="hub-stats">
        <div class="stat-badge"><span class="stat-icon">🎮</span> 6 GAMES</div>
        <div class="stat-badge"><span class="stat-icon">🏆</span> TON P2E</div>
        <div class="stat-badge"><span class="stat-icon">⚡</span> ZERO LAG</div>
      </div>

      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-cat="all">ALL</button>
        <button class="filter-btn" data-cat="arcade">ARCADE</button>
        <button class="filter-btn" data-cat="runner">RUNNER</button>
        <button class="filter-btn" data-cat="tap-to-earn">TAP-TO-EARN</button>
        <button class="filter-btn" data-cat="puzzle">PUZZLE</button>
        <button class="filter-btn" data-cat="classic">CLASSIC</button>
        <button class="filter-btn" data-cat="action">ACTION</button>
      </div>
    </header>

    <main class="hub-grid" id="gameGrid"></main>

    <footer class="hub-footer">
      <p>TON Ecosystem · Play-to-earn</p>
      <div class="footer-links">
        <a href="https://t.me/goldutyacommunity" target="_blank" rel="noopener noreferrer"> Telegram Community</a>
        <a href="https://t.me/Goldutyabot" target="_blank" rel="noopener noreferrer"> Play Bot</a>
      </div>
    </footer>
  </div>

  <script src="telegram.js"></script>
  <script src="leaderboard.js"></script>
  <script src="index.js"></script>
</body>
</html>
